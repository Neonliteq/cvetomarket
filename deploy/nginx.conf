server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Максимальный размер загружаемых файлов (для загрузки изображений)
    client_max_body_size 20M;

    # Gzip-сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Проксирование на Node.js приложение
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket поддержка
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Отключаем буферизацию для SSE/streaming
        proxy_buffering off;
    }

    # Статика (кэш на 1 год)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------
    # Кэш картинок /objects на диске nginx. Чтобы включить, добавьте
    # в http{} основного nginx.conf:
    #   proxy_cache_path /var/cache/nginx/cveto_objects levels=1:2
    #     keys_zone=cveto_objects:50m max_size=2g inactive=45d use_temp_path=off;
    # и в этот server (выше location статики):
    #   location ^~ /objects {
    #       proxy_pass http://127.0.0.1:5000;
    #       proxy_http_version 1.1;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #       proxy_cache cveto_objects;
    #       proxy_cache_valid 200 301 302 45d;
    #       proxy_cache_key "$scheme$request_method$host$request_uri";
    #       proxy_ignore_headers Cache-Control Expires Set-Cookie;
    #       add_header X-Cache-Status $upstream_cache_status;
    #       expires 30d;
    #   }
    # ---------------------------------------------------------------
    # ---------------------------------------------------------------
    # SSL — раскомментируйте после запуска:
    #   certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
    # Certbot автоматически добавит SSL-секцию ниже.
    # После получения сертификата включите HTTP/2 (мультиплексирование
    # сильно ускоряет загрузку на мобильных сетях):
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2 ipv6only=on;
    # (в конфиге, куда Certbot добавил строки listen 443 ssl)
    # ---------------------------------------------------------------
}
